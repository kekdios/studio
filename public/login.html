<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>ReelEnder — Sign in</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0a0a0f; color:#eee; font-family:-apple-system,system-ui,sans-serif; }
  img { width:180px; border-radius:20px; }
  h1 { font-size:1.3rem; font-weight:600; margin:1.4rem 0 .3rem; background:linear-gradient(90deg,#ff7a18,#3ddc84); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  p.sub { color:#777; font-size:.85rem; margin:0 0 1.6rem; }
  form { display:flex; flex-direction:column; gap:10px; width:260px; }
  input { background:#1c1c26; border:1px solid #333; border-radius:8px; color:#eee; padding:10px 12px; font-size:.95rem; }
  button { background:linear-gradient(135deg,#ff7a18,#e2483d); border:none; color:#fff; padding:10px; border-radius:8px; font-size:.95rem; font-weight:600; cursor:pointer; }
  button.ghost { background:#1c1c26; border:1px solid #333; color:#888; font-weight:400; font-size:.8rem; }
  #err { color:#e2483d; font-size:.8rem; min-height:1em; }
  #msg { color:#3ddc84; font-size:.8rem; min-height:1em; }
  #codeStep { display:none; }
  details { margin-top:1.2rem; font-size:.75rem; color:#555; width:260px; }
  details summary { cursor:pointer; }
  details form { margin-top:8px; }
</style>
</head>
<body>
  <img src="/reelenderlogosq.png" alt="ReelEnder">
  <h1>ReelEnder Studio</h1>
  <p class="sub">sign in to the writers' room</p>

  <form id="emailStep">
    <input id="email" type="email" placeholder="your email" autocomplete="email" required>
    <button type="submit">send me a code</button>
  </form>

  <form id="codeStep">
    <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code" required>
    <button type="submit">enter</button>
  </form>

  <p id="msg"></p>
  <p id="err"></p>

  <details>
    <summary>have a passphrase instead?</summary>
    <form id="pwStep">
      <input id="pw" type="password" placeholder="passphrase" autocomplete="current-password">
      <button type="submit">enter with passphrase</button>
    </form>
  </details>

<script>
const err = m => document.getElementById('err').textContent = m;
const msg = m => document.getElementById('msg').textContent = m;
const post = (u, b) => fetch(u, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b) });

document.getElementById('emailStep').onsubmit = async (e) => {
  e.preventDefault(); err(''); msg('sending…');
  const res = await post('/api/otp/request', { email: document.getElementById('email').value });
  const data = await res.json();
  if (res.ok) {
    msg('code sent — check your email (expires in 10 min)');
    document.getElementById('emailStep').style.display = 'none';
    document.getElementById('codeStep').style.display = 'flex';
    document.getElementById('code').focus();
  } else { msg(''); err(data.error || 'could not send'); }
};

document.getElementById('codeStep').onsubmit = async (e) => {
  e.preventDefault(); err('');
  const res = await post('/api/otp/verify', { email: document.getElementById('email').value, code: document.getElementById('code').value });
  if (res.ok) location.href = '/room';
  else err((await res.json()).error || 'nope');
};

document.getElementById('pwStep').onsubmit = async (e) => {
  e.preventDefault(); err('');
  const res = await post('/api/login', { password: document.getElementById('pw').value });
  if (res.ok) location.href = '/room';
  else err('wrong passphrase');
};
</script>
</body>
</html>
