<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>Jacob — daily jokes</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:#0a0a0f; color:#eee; font-family:-apple-system,system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid #1c1c26; position:sticky; top:0; background:#0a0a0f; z-index:1; }
  header img { height:34px; border-radius:8px; }
  header h1 { font-size:1rem; font-weight:600; margin:0; }
  header .sub { color:#777; font-size:.8rem; }
  header a.room { margin-left:auto; font-size:.8rem; color:#aaa; text-decoration:none; border:1px solid #333; padding:6px 12px; border-radius:999px; }
  header a.room:hover { color:#fff; border-color:#666; }
  #grid { max-width:860px; margin:0 auto; padding:18px 14px 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  .tile { position:relative; aspect-ratio:9/16; background:#13131c; border:1px solid #23232f; border-radius:12px; overflow:hidden; cursor:pointer; padding:0; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:#fff; background:linear-gradient(transparent 55%, rgba(0,0,0,.65)); text-shadow:0 2px 8px #000; }
  .tile .teaser { position:absolute; left:8px; right:8px; bottom:8px; font-size:.62rem; line-height:1.3; color:#ddd; text-align:left; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #lightbox.open { display:flex; }
  #lbCard { width:100%; max-width:400px; max-height:100%; overflow-y:auto; background:#13131c; border:1px solid #23232f; border-radius:16px; overflow-x:hidden; }
  #lbCard video { width:100%; display:block; background:#000; }
  #lbMeta { padding:14px 16px; }
  #lbJoke { font-size:1rem; line-height:1.5; margin:0 0 10px; }
  #lbDate { font-size:.72rem; color:#666; margin-bottom:10px; }
  .socials { display:flex; gap:8px; flex-wrap:wrap; }
  .socials a { font-size:.75rem; color:#aaa; text-decoration:none; border:1px solid #333; padding:5px 11px; border-radius:999px; }
  .socials a:hover { color:#fff; border-color:#666; }
  #lbClose { position:absolute; top:14px; right:16px; background:none; border:none; color:#aaa; font-size:2rem; cursor:pointer; line-height:1; }
  .empty { grid-column:1/-1; text-align:center; color:#666; padding:60px 20px; }
  @media (min-width:600px) { #grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; } }
</style>
</head>
<body>
<header>
  <img src="/reelenderlogosq.png" alt="">
  <div><h1>Jacob</h1><div class="sub">Traveling Joker</div></div>
  <a class="room" href="/room">joke room</a>
</header>
<div id="grid"><div class="empty">loading…</div></div>
<div id="lightbox">
  <button id="lbClose" aria-label="close">&times;</button>
  <div id="lbCard">
    <video id="lbVideo" controls playsinline></video>
    <div id="lbMeta">
      <p id="lbJoke"></p>
      <div id="lbDate"></div>
      <div class="socials" id="lbSocials"></div>
    </div>
  </div>
</div>
<script>
(async () => {
const grid = document.getElementById('grid');
const lb = document.getElementById('lightbox');
const lbVideo = document.getElementById('lbVideo');
const socialLabel = { tiktok:'TikTok', instagram:'Instagram', youtube:'YouTube', x:'X' };
const roomLink = document.querySelector('a.room');
try {
  const r = await fetch('/api/jokes');
  if (r.ok) { roomLink.textContent = 'joke room →'; }
  else { roomLink.textContent = '← back'; roomLink.href = '/'; }
} catch { roomLink.textContent = '← back'; roomLink.href = '/'; }
let clips = [];
try { clips = await (await fetch('/api/clips')).json(); } catch {}
grid.innerHTML = '';
if (!clips.length) grid.innerHTML = '<div class="empty">no clips yet — Jacob is still in makeup</div>';
function open(c) {
  lbVideo.src = '/clips-media/' + c.file;
  if (c.poster) lbVideo.poster = '/clips-media/' + c.poster;
  document.getElementById('lbJoke').textContent = c.joke || '';
  document.getElementById('lbDate').textContent = c.ts || '';
  const s = document.getElementById('lbSocials');
  s.innerHTML = '';
  for (const [k,u] of Object.entries(c.socials || {})) {
    if (!u) continue;
    const a = document.createElement('a');
    a.href = u; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'watch on ' + (socialLabel[k] || k); s.appendChild(a);
  }
  lb.classList.add('open');
  lbVideo.play().catch(() => {});
}
function close() { lb.classList.remove('open'); lbVideo.pause(); lbVideo.removeAttribute('src'); lbVideo.load(); }
for (const c of clips) {
  const tile = document.createElement('button');
  tile.className = 'tile';
  tile.onclick = () => open(c);
  if (c.poster) {
    const img = document.createElement('img');
    img.src = '/clips-media/' + c.poster;
    img.alt = ''; img.loading = 'lazy';
    tile.appendChild(img);
  }
  const play = document.createElement('div'); play.className = 'play'; play.textContent = '▶';
  tile.appendChild(play);
  if (c.joke) {
    const t = document.createElement('div'); t.className = 'teaser'; t.textContent = c.joke;
    tile.appendChild(t);
  }
  grid.appendChild(tile);
}
document.getElementById('lbClose').onclick = close;
lb.onclick = e => { if (e.target === lb) close(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
})();
</script>
</body>
</html>
