<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>Jacob — daily jokes</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:#0a0a0f; color:#eee; font-family:-apple-system,system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid #1c1c26; position:sticky; top:0; background:#0a0a0f; z-index:1; }
  header img { height:34px; border-radius:8px; }
  header h1 { font-size:1rem; font-weight:600; margin:0; }
  header .sub { color:#777; font-size:.8rem; }
  header a.room { margin-left:auto; font-size:.8rem; color:#aaa; text-decoration:none; border:1px solid #333; padding:6px 12px; border-radius:999px; }
  header a.room:hover { color:#fff; border-color:#666; }
  #grid { max-width:860px; margin:0 auto; padding:18px 14px 60px; display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
  .tile { position:relative; width:100%; aspect-ratio:9/16; background:#13131c; border:1px solid #23232f; border-radius:12px; overflow:hidden; cursor:pointer; padding:0; }
  .tile img { width:100%; height:100%; object-fit:cover; display:block; }
  .tile .play { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:#fff; background:linear-gradient(transparent 55%, rgba(0,0,0,.65)); text-shadow:0 2px 8px #000; }
  .tile .teaser { position:absolute; left:8px; right:8px; bottom:8px; font-size:.62rem; line-height:1.3; color:#ddd; text-align:left; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .vcount { text-align:center; font-size:.68rem; color:#777; margin-top:5px; }
  .vcount .u { color:#3ddc84; } .vcount .d { color:#e2483d; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:10; padding:16px; }
  #lightbox.open { display:flex; }
  #lbCard { max-width:92vw; max-height:92vh; background:#13131c; border:1px solid #23232f; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
  #lbCard video { display:block; background:#000; width:auto; height:auto; max-width:92vw; max-height:62vh; margin:0 auto; }
  #lbMeta { padding:14px 16px; }
  #lbJoke { font-size:1rem; line-height:1.5; margin:0 0 10px; }
  #lbDate { font-size:.72rem; color:#666; margin-bottom:10px; }
  .socials { display:flex; gap:8px; flex-wrap:wrap; }
  .socials a { font-size:.75rem; color:#aaa; text-decoration:none; border:1px solid #333; padding:5px 11px; border-radius:999px; }
  .socials a:hover { color:#fff; border-color:#666; }
  .votes { display:flex; gap:10px; margin-top:12px; }
  .votes button { flex:1; background:#1c1c26; border:1px solid #3a3a4a; color:#ccc; font-size:.85rem; padding:8px; border-radius:8px; cursor:pointer; }
  .votes button:hover { border-color:#666; color:#fff; }
  .votes button.mine.up { border-color:#2d7a4f; color:#3ddc84; background:#173a26; }
  .votes button.mine.down { border-color:#7a2d2d; color:#e2483d; background:#3a1717; }
  #lbClose { position:absolute; top:14px; right:16px; background:none; border:none; color:#aaa; font-size:2rem; cursor:pointer; line-height:1; }
  .empty { grid-column:1/-1; text-align:center; color:#666; padding:60px 20px; }
  .note { text-align:center; font-size:.72rem; color:#666; padding:10px 20px 30px; }
  header button.mode { margin-left:auto; font-size:.8rem; color:#eee; background:#1c1c26; border:1px solid #3a3a4a; padding:6px 12px; border-radius:999px; cursor:pointer; }
  header button.mode:hover { border-color:#666; }
  header button.mode + a.room { margin-left:0; }
  #feed { position:fixed; inset:0; background:#0a0a0f; z-index:8; }
  #feedScroll { height:100%; overflow-y:scroll; scroll-snap-type:y mandatory; touch-action:none; scrollbar-width:none; }
  #feedScroll::-webkit-scrollbar { display:none; }
  .fcard { position:relative; height:100%; scroll-snap-align:start; scroll-snap-stop:always; background:#000; display:flex; align-items:center; justify-content:center; }
  .fcard video { width:100%; height:100%; object-fit:contain; background:#000; }
  .frail { position:absolute; right:10px; bottom:96px; display:flex; flex-direction:column; gap:14px; }
  .frail button { display:flex; flex-direction:column; align-items:center; gap:2px; background:rgba(0,0,0,.45); border:1px solid #3a3a4a; color:#ccc; font-size:1.3rem; width:52px; padding:9px 0; border-radius:14px; cursor:pointer; }
  .frail button span { font-size:.68rem; color:#999; }
  .frail button:hover { border-color:#777; color:#fff; }
  .frail button.up.mine { border-color:#2d7a4f; color:#3ddc84; background:rgba(23,58,38,.7); }
  .frail button.dn.mine { border-color:#7a2d2d; color:#e2483d; background:rgba(58,23,23,.7); }
  .fjoke { position:absolute; left:14px; right:76px; bottom:18px; font-size:.85rem; line-height:1.45; color:#eee; text-shadow:0 1px 6px #000; }
  .fcard .mute { position:absolute; top:14px; right:12px; background:rgba(0,0,0,.55); border:none; color:#fff; font-size:1rem; width:38px; height:38px; border-radius:50%; cursor:pointer; }
  .fspin { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:44px; height:44px; border:4px solid rgba(255,255,255,.15); border-top-color:#e8b84b; border-radius:50%; animation:frot .8s linear infinite; pointer-events:none; display:none; }
  .fpause { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:3rem; color:rgba(255,255,255,.85); text-shadow:0 2px 12px #000; pointer-events:none; display:none; }
  @keyframes frot { to { transform:translate(-50%,-50%) rotate(360deg); } }
  #feedExit { position:absolute; top:14px; left:14px; z-index:9; background:rgba(0,0,0,.55); border:1px solid #3a3a4a; color:#eee; font-size:.8rem; padding:7px 14px; border-radius:999px; cursor:pointer; }
  #feedExit:hover { border-color:#777; }
  @media (min-width:600px) { #grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; } }
</style>
</head>
<body>
<header>
  <img src="/reelenderlogosq.png" alt="">
  <div><h1>Jacob</h1><div class="sub">Traveling Joker</div></div>
  <button class="mode" id="modeBtn">⇄ scroll</button>
  <a class="room" href="/room">joke room</a>
</header>
<div id="grid"><div class="empty">loading…</div></div>
<div id="feed" hidden>
  <div id="feedScroll"></div>
  <button id="feedExit">▦ grid</button>
</div>
<div class="note">all of Jacob's clips are open source — use them for whatever you want</div>
<div id="lightbox">
  <button id="lbClose" aria-label="close">&times;</button>
  <div id="lbCard">
    <video id="lbVideo" controls playsinline></video>
    <div id="lbMeta">
      <p id="lbJoke"></p>
      <div id="lbDate"></div>
      <div class="socials" id="lbSocials"></div>
      <div class="votes">
        <button id="voteUp">👍 0</button>
        <button id="voteDown">👎 0</button>
      </div>
    </div>
  </div>
</div>
<script>
(async () => {
const grid = document.getElementById('grid');
const lb = document.getElementById('lightbox');
const lbVideo = document.getElementById('lbVideo');
const socialLabel = { tiktok:'TikTok', instagram:'Instagram', youtube:'YouTube', x:'X' };
const roomLink = document.querySelector('a.room');
try {
  const r = await fetch('/api/jokes');
  if (r.ok) { roomLink.textContent = 'joke room →'; }
  else { roomLink.textContent = '← back'; roomLink.href = '/'; }
} catch { roomLink.textContent = '← back'; roomLink.href = '/'; }
const voteUp = document.getElementById('voteUp');
const voteDown = document.getElementById('voteDown');
let currentClip = null;
function paintVotes(votes, myVote) {
  voteUp.textContent = `👍 ${votes?.up || 0}`;
  voteDown.textContent = `👎 ${votes?.down || 0}`;
  voteUp.className = myVote === 'up' ? 'mine up' : '';
  voteDown.className = myVote === 'down' ? 'mine down' : '';
}
const voteEls = {}, feedPaint = {};
function paintTileVote(c) {
  const vc = voteEls[c.id]; if (!vc) return;
  const up = c.votes?.up || 0, down = c.votes?.down || 0;
  vc.innerHTML = `<span class="u"${c.myVote === 'up' ? ' style="color:#3ddc84"' : ''}>👍 ${up}</span> · <span class="d"${c.myVote === 'down' ? ' style="color:#e2483d"' : ''}>👎 ${down}</span>`;
}
async function castVote(vote, clip = currentClip) {
  if (!clip) return;
  const r = await fetch('/api/clips/vote', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:clip.id, vote}) });
  const d = await r.json();
  if (r.ok) { clip.votes = d.votes; clip.myVote = d.myVote; if (clip === currentClip) paintVotes(d.votes, d.myVote); paintTileVote(clip); feedPaint[clip.id]?.(); }
}
voteUp.onclick = () => castVote('up');
voteDown.onclick = () => castVote('down');
let clips = [];
try { clips = await (await fetch('/api/clips')).json(); } catch {}
grid.innerHTML = '';
if (!clips.length) grid.innerHTML = '<div class="empty">no clips yet — Jacob is still in makeup</div>';
function open(c) {
  currentClip = c;
  paintVotes(c.votes, c.myVote);
  lbVideo.src = '/clips-media/' + c.file;
  if (c.poster) lbVideo.poster = '/clips-media/' + c.poster;
  document.getElementById('lbJoke').textContent = c.joke || '';
  document.getElementById('lbDate').textContent = c.ts || '';
  const s = document.getElementById('lbSocials');
  s.innerHTML = '';
  for (const [k,u] of Object.entries(c.socials || {})) {
    if (!u) continue;
    const a = document.createElement('a');
    a.href = u; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'watch on ' + (socialLabel[k] || k); s.appendChild(a);
  }
  lb.classList.add('open');
  lbVideo.play().catch(() => {});
}
function close() { lb.classList.remove('open'); lbVideo.pause(); lbVideo.removeAttribute('src'); lbVideo.load(); }
for (const c of clips) {
  const cell = document.createElement('div');
  const tile = document.createElement('button');
  tile.className = 'tile';
  tile.onclick = () => open(c);
  if (c.poster) {
    const img = document.createElement('img');
    img.src = '/clips-media/' + c.poster;
    img.alt = ''; img.loading = 'lazy';
    tile.appendChild(img);
  }
  const play = document.createElement('div'); play.className = 'play'; play.textContent = '▶';
  tile.appendChild(play);
  if (c.joke) {
    const t = document.createElement('div'); t.className = 'teaser'; t.textContent = c.joke;
    tile.appendChild(t);
  }
  cell.appendChild(tile);
  const vc = document.createElement('div');
  vc.className = 'vcount';
  voteEls[c.id] = vc;
  paintTileVote(c);
  cell.appendChild(vc);
  grid.appendChild(cell);
}
// --- scroll feed (tiktok-style) ---
const feed = document.getElementById('feed');
const feedScroll = document.getElementById('feedScroll');
const modeBtn = document.getElementById('modeBtn');
let feedMode = false, soundOn = false;
function feedCard(c) {
  const el = document.createElement('div');
  el.className = 'fcard'; el.dataset.file = c.file;
  const v = document.createElement('video');
  v.loop = true; v.playsInline = true; v.muted = true; v.preload = 'metadata';
  if (c.poster) v.poster = '/clips-media/' + c.poster;
  const spin = document.createElement('div'); spin.className = 'fspin';
  const pp = document.createElement('div'); pp.className = 'fpause'; pp.textContent = '▶';
  v.addEventListener('waiting', () => { spin.style.display = 'block'; });
  v.addEventListener('playing', () => { spin.style.display = 'none'; pp.style.display = 'none'; });
  v.addEventListener('pause', () => { spin.style.display = 'none'; if (feedActive === el) pp.style.display = 'block'; });
  el.append(v, spin, pp);
  const mute = document.createElement('button'); mute.className = 'mute'; mute.textContent = '🔇';
  mute.onclick = () => { v.muted = !v.muted; soundOn = !v.muted; mute.textContent = v.muted ? '🔇' : '🔊'; if (!v.muted) v.play().catch(() => {}); };
  el.appendChild(mute);
  if (c.joke) {
    const jk = document.createElement('div'); jk.className = 'fjoke'; jk.textContent = c.joke;
    el.appendChild(jk);
  }
  const rail = document.createElement('div'); rail.className = 'frail';
  const up = document.createElement('button'); up.className = 'up'; up.innerHTML = '👍<span></span>';
  const dn = document.createElement('button'); dn.className = 'dn'; dn.innerHTML = '👎<span></span>';
  feedPaint[c.id] = () => {
    up.querySelector('span').textContent = c.votes?.up || 0;
    dn.querySelector('span').textContent = c.votes?.down || 0;
    up.classList.toggle('mine', c.myVote === 'up');
    dn.classList.toggle('mine', c.myVote === 'down');
  };
  up.onclick = () => castVote('up', c);
  dn.onclick = () => castVote('down', c);
  rail.append(up, dn);
  el.appendChild(rail);
  feedPaint[c.id]();
  return el;
}
let feedActive = null, feedTimer = null;
const feedIO = new IntersectionObserver(es => {
  for (const e of es) {
    const v = e.target.querySelector('video');
    if (!v) continue;
    if (e.intersectionRatio >= .85) { // margin-boosted neighbors top out at .8 — only the on-screen card qualifies
      if (!v.src) v.src = '/clips-media/' + e.target.dataset.file;
      if (feedActive === e.target) continue;
      feedActive = e.target;
      clearTimeout(feedTimer);
      const card = e.target;
      feedTimer = setTimeout(() => { // only the settled card plays — blips while scrolling past don't count
        if (feedActive !== card) return;
        feedScroll.querySelectorAll('video').forEach(x => { if (x !== v) { x.pause(); x.muted = true; } });
        v.muted = !soundOn;
        const m = card.querySelector('.mute');
        if (m) m.textContent = v.muted ? '🔇' : '🔊';
        if (v.readyState < 3) card.querySelector('.fspin').style.display = 'block'; // buffer spinner until the real clip is ready
        v.play().catch(() => {});
      }, 220);
    } else {
      if (e.intersectionRatio > 0 && !v.src) { v.src = '/clips-media/' + e.target.dataset.file; v.preload = 'auto'; } // actually buffer neighbors inside the margin
      v.pause(); v.muted = true; // anything off-center is silent — only the clip in view may sound
      if (feedActive === e.target) feedActive = null;
    }
  }
}, { root: feedScroll, rootMargin: '80% 0px', threshold: [0, .85] });
function buildFeed() {
  feedScroll.querySelectorAll('.fcard').forEach(el => feedIO.unobserve(el));
  feedScroll.innerHTML = '';
  for (const c of clips) { const el = feedCard(c); feedScroll.appendChild(el); feedIO.observe(el); }
}
function feedIdx() { return Math.round(feedScroll.scrollTop / Math.max(1, feedScroll.clientHeight)); }
// discrete paging — one gesture = one clip, never parked between two
let jumpLock = false;
function feedJump(d) {
  const i = feedIdx();
  const n = Math.max(0, Math.min(clips.length - 1, i + d));
  if (n === i) return;
  feedActive = null; clearTimeout(feedTimer);
  feedScroll.querySelectorAll('video').forEach(v => { v.pause(); v.muted = true; }); // hard-mute everything during the handoff
  feedScroll.scrollTo({ top: n * feedScroll.clientHeight, behavior: 'instant' });
}
feedScroll.addEventListener('wheel', e => {
  e.preventDefault();
  if (jumpLock) return;
  jumpLock = true; setTimeout(() => jumpLock = false, 280);
  feedJump(e.deltaY > 0 ? 1 : -1);
}, { passive: false });
let tY = null;
feedScroll.addEventListener('pointerdown', e => { if (!e.target.closest('button')) tY = e.clientY; });
feedScroll.addEventListener('pointerup', e => {
  if (tY == null) return;
  const dy = e.clientY - tY; tY = null;
  if (Math.abs(dy) > 60) { feedJump(dy < 0 ? 1 : -1); return; }
  const card = e.target.closest('.fcard'), v = card?.querySelector('video'); // tap = play/pause toggle
  if (v && feedActive === card) { v.paused ? v.play().catch(() => {}) : v.pause(); }
});
function toggleFeed(on) {
  feedMode = on;
  feed.hidden = !on;
  if (on) {
    if (feedScroll.children.length !== clips.length) buildFeed();
    const fi = clips.findIndex(c => !c.myVote);
    if (fi > 0) feedScroll.scrollTop = fi * feedScroll.clientHeight;
    else feedScroll.scrollTop = 0;
  } else {
    feedScroll.querySelectorAll('video').forEach(v => v.pause());
  }
}
modeBtn.onclick = () => toggleFeed(true);
document.getElementById('feedExit').onclick = () => toggleFeed(false);
document.getElementById('lbClose').onclick = close;
lb.onclick = e => { if (e.target === lb) close(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (feedMode) toggleFeed(false); else close(); return; }
  if (!feedMode) return;
  const i = feedIdx();
  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); feedJump(1); }
  if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); feedJump(-1); }
  if (e.key === 'ArrowRight' && clips[i]) castVote('up', clips[i]);
  if (e.key === 'ArrowLeft' && clips[i]) castVote('down', clips[i]);
});
})();
</script>
</body>
</html>
