<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>ReelEnder — The Joke Room</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:#0a0a0f; color:#eee; font-family:-apple-system,system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid #1c1c26; flex-wrap:wrap; row-gap:8px; }
  header img { height:36px; }
  header h1 { font-size:1rem; font-weight:600; margin:0; }
  header .sub { color:#777; font-size:.8rem; }
  #kept { margin-left:auto; font-size:.75rem; color:#3ddc84; }
  #balance { font-size:.75rem; color:#666; margin-left:12px; }
  #galleryLink { margin-left:10px; background:#1c1c26; border:1px solid #333; color:#aaa; font-size:.72rem; padding:4px 10px; border-radius:6px; text-decoration:none; }
  #galleryLink:hover { color:#fff; border-color:#555; }
  #newSession { margin-left:10px; background:#1c1c26; border:1px solid #333; color:#aaa; font-size:.72rem; padding:4px 10px; border-radius:6px; cursor:pointer; }
  #newSession:hover { color:#fff; border-color:#555; }
  #logout { background:none; border:1px solid #333; color:#aaa; font-size:.72rem; padding:4px 10px; border-radius:6px; cursor:pointer; }
  #logout:hover { color:#fff; border-color:#555; }
  #vaultBtn { background:#1c1c26; border:1px solid #333; color:#aaa; font-size:.72rem; padding:4px 10px; border-radius:6px; cursor:pointer; }
  #vaultBtn:hover { color:#fff; border-color:#555; }
  #vault { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:10; padding:14px; }
  #vault.open { display:flex; }
  #vaultCard { width:100%; max-width:560px; height:80vh; background:#101018; border:1px solid #23232f; border-radius:16px; display:flex; flex-direction:column; overflow:hidden; }
  #vaultHead { display:flex; gap:6px; padding:10px 12px; border-bottom:1px solid #23232f; align-items:center; }
  #vaultHead .tab { background:none; border:1px solid #333; color:#aaa; font-size:.78rem; padding:5px 12px; border-radius:999px; cursor:pointer; }
  #vaultHead .tab.on { color:#fff; border-color:#777; background:#1c1c26; }
  #vaultHead .tab .n { opacity:.6; }
  #vaultClose { margin-left:auto; background:none; border:none; color:#aaa; font-size:1.5rem; cursor:pointer; line-height:1; }
  #vaultList { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .vrow { background:#16161f; border:1px solid #2a2a3a; border-radius:12px; padding:10px 12px; }
  .vrow.produced { border-color:#2d7a4f; }
  .vrow .vtxt { font-size:.9rem; line-height:1.45; margin-bottom:8px; white-space:pre-wrap; }
  .vrow .vflag { font-size:.68rem; color:#3ddc84; font-weight:600; }
  .vrow .vbtns { display:flex; gap:6px; flex-wrap:wrap; }
  .vrow .vbtns button { background:#1c1c26; border:1px solid #3a3a4a; color:#ccc; font-size:.72rem; padding:4px 10px; border-radius:6px; cursor:pointer; }
  .vrow .vbtns button:hover { border-color:#666; color:#fff; }
  .vrow .vbtns button.prod { border-color:#2d7a4f; color:#3ddc84; }
  .vrow .vbtns button.del { border-color:#7a2d2d; }
  .vrow .vrender { font-size:.72rem; color:#e8b84b; margin-bottom:8px; }
  .vrow .vrender.err { color:#e2483d; }
  .vrow .vrender.ok { color:#3ddc84; }
  .vrow.hot { border-color:#5a4a1a; }
  .vsteps { display:flex; gap:4px; align-items:center; font-size:.68rem; color:#666; margin-bottom:8px; flex-wrap:wrap; }
  .vsteps .s { padding:2px 8px; border-radius:999px; border:1px solid #2a2a3a; }
  .vsteps .s.done { color:#3ddc84; border-color:#2d7a4f; }
  .vsteps .s.now { color:#e8b84b; border-color:#5a4a1a; }
  .vsteps .ar { color:#444; }
  .vscenes { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px; }
  .vscenes img { width:100%; border-radius:8px; border:2px solid transparent; cursor:pointer; display:block; }
  .vscenes img.pick { border-color:#3ddc84; }
  .rform { width:100%; display:flex; flex-direction:column; gap:10px; }
  .rform input, .rform textarea, .rform select { background:#0e0e17; border:1px solid #2c2c44; color:#e8e8f2; border-radius:10px; padding:11px 13px; font:inherit; font-size:.9rem; width:100%; box-sizing:border-box; outline:none; transition:border-color .15s, box-shadow .15s; }
  .rform textarea { resize:vertical; line-height:1.55; font-size:.85rem; }
  .rform select { appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg, transparent 50%, #8a8aa0 50%), linear-gradient(135deg, #8a8aa0 50%, transparent 50%); background-position:calc(100% - 19px) 50%, calc(100% - 14px) 50%; background-size:5px 5px; background-repeat:no-repeat; cursor:pointer; padding-right:36px; }
  .rform input:focus, .rform textarea:focus, .rform select:focus { border-color:#5b5bd6; box-shadow:0 0 0 3px rgba(91,91,214,.16); }
  .rform input::placeholder { color:#4e4e60; }
  .rform .rrow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .rform .rstatus { font-size:.75rem; color:#888; }
  .rform .flabel { font-size:.66rem; text-transform:uppercase; letter-spacing:.08em; color:#777; margin-bottom:-4px; }
  .pane button { background:#1c1c26; border:1px solid #3a3a4a; color:#ddd; font-size:.82rem; padding:8px 16px; border-radius:999px; cursor:pointer; }
  .pane button:hover { border-color:#666; color:#fff; }
  .pane button.prod { border-color:#2d7a4f; color:#3ddc84; }
  .pane button.prod:hover { background:#173a26; }
  .pane button.del { border-color:#7a2d2d; }
  .pane button.del:hover { background:#3a1717; }
  .pane button:disabled { opacity:.5; cursor:default; }
  .vrow .watch { font-size:.78rem; color:#e8b84b; text-decoration:none; border:1px solid #5a4a1a; padding:4px 10px; border-radius:6px; display:inline-block; margin-bottom:8px; }
  .vrow textarea { width:100%; background:#0d0d14; border:1px solid #555; border-radius:8px; color:#eee; padding:8px 10px; font:inherit; font-size:.9rem; margin-bottom:8px; resize:vertical; }
  .vempty { text-align:center; color:#555; padding:40px 10px; font-size:.85rem; }

  #transcript { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; max-width:760px; width:100%; margin:0 auto; }
  .turn { max-width:85%; padding:10px 14px; border-radius:14px; line-height:1.45; font-size:.95rem; white-space:pre-wrap; }
  .turn .who { font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; margin-bottom:4px; opacity:.55; display:flex; gap:8px; align-items:center; }
  .user { align-self:flex-end; background:#1e3a5f; }
  .assistant { align-self:flex-start; background:#1c1c26; }
  .replay { cursor:pointer; opacity:.6; font-size:.85rem; }
  .replay:hover { opacity:1; }
  .cost { font-size:.65rem; opacity:.45; }

  .joke { align-self:stretch; background:#16161f; border:1px solid #2a2a3a; border-radius:14px; padding:14px 16px; }
  .joke .txt { font-size:1rem; line-height:1.5; margin-bottom:10px; white-space:pre-wrap; }
  .joke .editbox { width:100%; background:#0d0d14; border:1px solid #555; border-radius:8px; color:#eee; padding:8px 10px; font:inherit; font-size:.95rem; line-height:1.4; margin-bottom:10px; resize:vertical; }
  .joke .actions { display:flex; gap:8px; }
  .joke button { border:1px solid #3a3a4a; background:#1c1c26; color:#ddd; font-size:.8rem; padding:6px 12px; border-radius:8px; cursor:pointer; }
  .joke button:hover { border-color:#666; }
  .joke button.keep { border-color:#2d7a4f; }
  .joke button.keep:hover { background:#173a26; }
  .joke button.toss { border-color:#7a2d2d; }
  .joke button.toss:hover { background:#3a1717; }
  .joke .verdict { font-size:.78rem; font-weight:600; }
  .joke.kept { border-color:#2d7a4f; opacity:.75; }
  .joke.kept .verdict { color:#3ddc84; }
  .joke.tossed { opacity:.45; }
  .joke.tossed .verdict { color:#e2483d; }
  .joke .tag { font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; opacity:.5; margin-bottom:6px; }
  .joke .dupe { display:block; width:100%; text-align:left; font-size:.72rem; color:#e8b84b; background:#221d10; border:1px solid #5a4a1a; border-radius:8px; padding:6px 10px; margin-bottom:10px; cursor:pointer; line-height:1.4; }
  .joke .dupe.open { color:#ffd97a; }

  section { flex:1; display:flex; flex-direction:column; min-height:0; }
  section[hidden] { display:none; }
  #stageBar { display:flex; gap:6px; padding:8px 20px; border-bottom:1px solid #1c1c26; align-items:center; position:sticky; top:0; background:#0a0a0f; z-index:5; flex-wrap:wrap; }
  #stageBar .stab { background:none; border:1px solid #333; color:#aaa; font-size:.82rem; padding:6px 14px; border-radius:999px; cursor:pointer; position:relative; }
  #stageBar .stab.on { color:#fff; border-color:#777; background:#1c1c26; }
  #stageBar .stab:disabled { opacity:.35; cursor:default; }
  #stageBar .stab .dot { position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%; background:#e8b84b; }
  #workOn { margin-left:auto; font-size:.72rem; color:#777; max-width:45%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pane { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; max-width:640px; width:100%; margin:0 auto; }
  .pane .phint { color:#777; font-size:.85rem; }
  .pane .phint.big { text-align:center; padding:60px 20px; font-size:.95rem; }
  .pane .pjoke { background:#16161f; border:1px solid #2a2a3a; border-radius:12px; padding:12px 14px; font-size:.9rem; line-height:1.45; }
  .pane .pjoke .ptag { font-size:.65rem; text-transform:uppercase; letter-spacing:.08em; color:#e8b84b; margin-bottom:6px; }
  .pane .picklist { display:flex; flex-direction:column; gap:8px; }
  .pane .pickrow { background:#16161f; border:1px solid #2a2a3a; border-radius:10px; padding:10px 12px; font-size:.82rem; display:flex; gap:10px; align-items:center; cursor:pointer; }
  .pane .pickrow:hover { border-color:#555; }
  .pane .pickrow span { flex:1; }
  .pane .sceneBig { width:min(300px,80%); border-radius:12px; align-self:center; border:1px solid #2a2a3a; }
  #controls { border-top:1px solid #1c1c26; padding:16px 20px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  #status { font-size:.8rem; color:#888; min-height:1.2em; }
  #btnRow { display:flex; gap:14px; align-items:center; }
  #mic { width:72px; height:72px; border-radius:50%; border:none; cursor:pointer; font-size:1.7rem; background:linear-gradient(135deg,#ff7a18,#e2483d); color:#fff; transition:transform .1s, box-shadow .2s; }
  #mic:hover { transform:scale(1.05); }
  #mic.recording { background:linear-gradient(135deg,#3ddc84,#1fa); box-shadow:0 0 0 8px rgba(61,220,132,.15); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 14px rgba(61,220,132,.07); } }
  #scout { background:linear-gradient(135deg,#2d7a4f,#1f6); border:none; color:#fff; font-size:.85rem; font-weight:600; padding:12px 18px; border-radius:12px; cursor:pointer; }
  #scout:disabled { opacity:.4; cursor:default; }
  #textRow { display:flex; gap:8px; width:100%; max-width:560px; }
  #textRow input { flex:1; background:#1c1c26; border:1px solid #333; border-radius:8px; color:#eee; padding:8px 12px; font-size:.9rem; }
  #textRow button { background:#2a2a3a; border:1px solid #444; color:#ddd; padding:8px 14px; border-radius:8px; cursor:pointer; }
  .joke .actions { flex-wrap:wrap; }
  @media (max-width:520px) {
    header { padding:10px 12px; gap:8px; }
    header .sub { display:none; }
    #transcript { padding:12px; gap:10px; }
    .turn { max-width:92%; font-size:.9rem; }
    #mic { width:64px; height:64px; font-size:1.4rem; }
    #controls { padding:12px; }
  }
</style>
</head>
<body>
<header>
  <img src="/reelenderlogosq.png" alt="">
  <div><h1>The Joke Room</h1><div class="sub">curate Jacob's material</div></div>
  <span id="kept"></span>
  <span id="balance"></span>
  <a href="/clips" id="galleryLink" target="_blank">gallery ↗</a>
  <button id="vaultBtn">vault</button>
  <a href="/stats" id="statsLink" style="font-size:.72rem; color:#aaa; text-decoration:none; border:1px solid #333; padding:4px 10px; border-radius:6px;">stats</a>
  <button id="newSession">new session</button>
  <button id="logout">log out</button>
</header>

<nav id="stageBar">
  <button class="stab on" data-s="voice">1 · voice</button>
  <button class="stab" data-s="image">2 · image</button>
  <button class="stab" data-s="video" disabled>3 · video</button>
  <span id="workOn"></span>
</nav>

<section id="stage-voice"><div id="transcript"></div></section>
<section id="stage-image" hidden><div id="imagePane" class="pane"></div></section>
<section id="stage-video" hidden><div id="videoPane" class="pane"></div></section>

<div id="vault">
  <div id="vaultCard">
    <div id="vaultHead">
      <button class="tab on" data-t="accepted">kept <span class="n" id="nKept"></span></button>
      <button class="tab" data-t="produced">produced <span class="n" id="nProd"></span></button>
      <button class="tab" data-t="rejected">tossed <span class="n" id="nTossed"></span></button>
      <button id="vaultAdd" style="margin-left:6px; background:none; border:1px solid #333; color:#aaa; font-size:.78rem; padding:5px 12px; border-radius:999px; cursor:pointer;">＋ add</button>
      <button id="vaultClose">&times;</button>
    </div>
    <div id="addForm" style="display:none; padding:10px 12px; border-bottom:1px solid #23232f;">
      <textarea id="addText" rows="3" style="width:100%; background:#0d0d14; border:1px solid #555; border-radius:8px; color:#eee; padding:8px 10px; font:inherit; font-size:.9rem; resize:vertical;" placeholder="type the joke — [tags] work too"></textarea>
      <div style="display:flex; gap:6px; margin-top:6px;">
        <button id="addSave" style="background:none; border:1px solid #2d7a4f; color:#3ddc84; font-size:.78rem; padding:5px 12px; border-radius:999px; cursor:pointer;">save</button>
        <button id="addCancel" style="background:none; border:1px solid #333; color:#aaa; font-size:.78rem; padding:5px 12px; border-radius:999px; cursor:pointer;">cancel</button>
        <span id="addMsg" style="font-size:.72rem; color:#e2483d; align-self:center;"></span>
      </div>
    </div>
    <div id="vaultList"></div>
  </div>
</div>

<div id="controls">
  <div id="status">talk to the scout, or pull a batch of jokes</div>
  <div id="btnRow">
    <button id="scout">🃏 scout jokes</button>
    <button id="mic">🎙</button>
  </div>
  <div id="textRow">
    <input id="textInput" placeholder="direct the scout — 'more puns', 'work jokes'… or just talk" />
    <button id="sendText">send</button>
  </div>
</div>

<script>
const transcriptEl = document.getElementById('transcript');
const statusEl = document.getElementById('status');
const micBtn = document.getElementById('mic');
const scoutBtn = document.getElementById('scout');
let recorder = null, chunks = [], recording = false;

function setStatus(s) { statusEl.textContent = s; }
function setKept(n) { document.getElementById('kept').textContent = n ? `kept: ${n}` : ''; }

function renderTurn(e) {
  const div = document.createElement('div');
  div.className = 'turn ' + (e.role === 'user' ? 'user' : 'assistant');
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = e.role === 'user' ? 'you' : 'scout';
  if (e.audio && e.role === 'assistant') {
    const r = document.createElement('span');
    r.className = 'replay'; r.textContent = '▶';
    r.onclick = () => new Audio(e.audio).play();
    who.appendChild(r);
  }
  if (e.cost) {
    const c = document.createElement('span');
    c.className = 'cost'; c.textContent = '$' + Number(e.cost).toFixed(4);
    who.appendChild(c);
  }
  div.appendChild(who);
  div.appendChild(document.createTextNode(e.text));
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function renderJoke(j) {
  const card = document.createElement('div');
  card.className = 'joke';
  card.dataset.id = j.id;
  card.innerHTML = `<div class="tag">candidate</div><div class="txt"></div><div class="actions"></div>`;
  card.querySelector('.txt').textContent = j.text;
  const actions = card.querySelector('.actions');
  if (j.similar) {
    const warn = document.createElement('button');
    warn.className = 'dupe';
    const label = `⚠ ~${Math.round(j.similar.score*100)}% like a ${j.similar.where} joke — tap to compare`;
    warn.textContent = label;
    warn.onclick = () => {
      warn.classList.toggle('open');
      warn.textContent = warn.classList.contains('open')
        ? `⚠ in the ${j.similar.where} list: “${j.similar.text}”`
        : label;
    };
    card.insertBefore(warn, actions);
  }

  const hear = document.createElement('button');
  hear.textContent = '🔊 hear it';
  hear.onclick = async () => {
    hear.textContent = '…';
    const r = await fetch('/api/jokes/speak', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:j.id}) });
    const d = await r.json();
    hear.textContent = '🔊 hear it';
    if (d.audioUrl) new Audio(d.audioUrl).play();
  };

  const keep = document.createElement('button');
  keep.className = 'keep'; keep.textContent = '✅ keep';
  const toss = document.createElement('button');
  toss.className = 'toss'; toss.textContent = '❌ toss';
  const edit = document.createElement('button');
  edit.textContent = '✎ edit';
  edit.onclick = () => {
    const txt = card.querySelector('.txt');
    const ta = document.createElement('textarea');
    ta.className = 'editbox';
    ta.value = j.text;
    ta.rows = Math.min(6, Math.max(2, Math.ceil(j.text.length / 55)));
    ta.placeholder = 'add direction — [pause] [laughing] [whispers]…';
    txt.replaceWith(ta);
    ta.focus();
    const save = document.createElement('button'); save.className='keep'; save.textContent = '✔ save';
    const cancel = document.createElement('button'); cancel.textContent = 'cancel';
    actions.innerHTML = '';
    actions.append(save, cancel);
    const restore = () => {
      const t = document.createElement('div'); t.className = 'txt'; t.textContent = j.text;
      ta.replaceWith(t);
      actions.innerHTML = '';
      actions.append(hear, keep, toss, edit);
    };
    cancel.onclick = restore;
    save.onclick = async () => {
      const text = ta.value.trim();
      if (!text || text === j.text) return restore();
      save.textContent = '…';
      const r = await fetch('/api/jokes/edit', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:j.id, text}) });
      if (r.ok) { j.text = text; restore(); }
      else { save.textContent = '✔ save'; }
    };
  };

  const decide = async (decision) => {
    const r = await fetch('/api/jokes/decide', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:j.id, decision}) });
    if (!r.ok) return;
    card.classList.add(decision === 'accepted' ? 'kept' : 'tossed');
    actions.innerHTML = `<span class="verdict">${decision === 'accepted' ? 'kept' : 'tossed'}</span>`;
    actions.prepend(hear);
    if (decision === 'accepted') {
      const prod = document.createElement('button'); prod.className = 'keep'; prod.textContent = '🎬 produce';
      prod.onclick = () => { jokesCache = jokesCache || { accepted: [j] }; startProduction(j.id); };
      actions.append(prod);
    }
    loadCounts(); refreshJokes();
  };
  keep.onclick = () => decide('accepted');
  toss.onclick = () => decide('rejected');
  actions.append(hear, keep, toss, edit);
  transcriptEl.appendChild(card);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

async function loadCounts() {
  const d = await (await fetch('/api/jokes')).json();
  setKept(d.accepted.length);
}
async function loadTranscript() {
  const turns = await (await fetch('/api/transcript')).json();
  turns.forEach(renderTurn);
  const d = await (await fetch('/api/jokes')).json();
  setKept(d.accepted.length);
  d.pending.forEach(renderJoke);
  if (turns.length || d.pending.length) setStatus('pick up where you left off');
}

async function loadBalance() {
  try {
    const b = await (await fetch('/api/balance')).json();
    if (b.usd_spendable_balance != null)
      document.getElementById('balance').textContent = '$' + Number(b.usd_spendable_balance).toFixed(2);
  } catch {}
}

scoutBtn.onclick = async () => {
  scoutBtn.disabled = true;
  setStatus('scout is hunting for jokes…');
  try {
    const r = await fetch('/api/jokes/fetch', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({count:3}) });
    const d = await r.json();
    if (!r.ok) { setStatus('scout error: ' + (d.error || r.status)); }
    else if (!d.jokes.length) { setStatus('nothing new — all repeats or empty haul'); }
    else {
      d.jokes.forEach(renderJoke);
      setStatus(`${d.jokes.length} candidates — hear them, keep or toss`);
    }
  } catch(e) { setStatus('scout failed'); }
  scoutBtn.disabled = false;
  loadBalance();
};

async function sendTurn(body, headers) {
  setStatus('transcribing… thinking…');
  const res = await fetch('/api/turn', { method: 'POST', headers, body });
  const data = await res.json();
  if (!res.ok) { setStatus('error: ' + (data.error || res.status)); return; }
  if (data.userText) renderTurn({ role:'user', text:data.userText });
  if (data.replyText) {
    renderTurn({ role:'assistant', text:data.replyText, audio:data.audioUrl, cost:data.cost });
    setStatus('scout is speaking…');
    const a = new Audio(data.audioUrl);
    a.onended = () => setStatus('your turn');
    a.onerror = () => setStatus('your turn');
    a.play().catch(() => setStatus('tap ▶ on the reply to hear it'));
  } else setStatus('your turn');
  loadBalance();
}

micBtn.onclick = async () => {
  if (recording) { recorder.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) {
    setStatus('this browser can\'t record — type instead');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      recording = false; micBtn.classList.remove('recording'); micBtn.textContent = '🎙';
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
      if (blob.size < 500) { setStatus('too short — try again'); return; }
      await sendTurn(blob, { 'Content-Type': blob.type });
    };
    recorder.start();
    recording = true; micBtn.classList.add('recording'); micBtn.textContent = '⏹';
    setStatus('listening… press again when done');
  } catch (e) {
    setStatus('mic access denied — allow microphone or type instead');
  }
};

document.getElementById('sendText').onclick = () => {
  const inp = document.getElementById('textInput');
  if (!inp.value.trim()) return;
  sendTurn(JSON.stringify({ text: inp.value }), { 'Content-Type': 'application/json' });
  inp.value = '';
};
document.getElementById('textInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('sendText').click();
});

document.getElementById('newSession').onclick = async () => {
  if (!confirm('Start a fresh session? The current transcript is archived.')) return;
  await fetch('/api/session/new', { method: 'POST' });
  transcriptEl.innerHTML = '';
  setStatus('clean page — talk to the scout');
};

// --- vault catalog: kept & tossed, editable ---
const vaultEl = document.getElementById('vault');
const vaultList = document.getElementById('vaultList');
let vaultTab = 'accepted';
let vaultData = { accepted: [], rejected: [] };

async function loadVault() {
  const d = await (await fetch('/api/jokes')).json();
  vaultData = d;
  document.getElementById('nKept').textContent = `(${d.accepted.length})`;
  document.getElementById('nProd').textContent = `(${d.accepted.filter(j => j.produced).length})`;
  document.getElementById('nTossed').textContent = `(${d.rejected.length})`;
  renderVault();
}

const RENDER_ACTIVE = new Set(['running', 'awaiting_scene', 'awaiting_publish']);

// pipeline tracker: voice → stills → clip → live (idx = the chip that's active)
function stageBar(j) {
  const r = j.render;
  let idx = -1;
  if (j.produced || (r && r.status === 'done')) idx = 4;
  else if (r) {
    if (r.status === 'awaiting_publish' || (r.status === 'running' && r.step === 'publish')) idx = 3;
    else if (r.status === 'running' && r.step === 'render') idx = 2;
    else if (r.status === 'awaiting_scene' || (r.status === 'running' && r.step === 'stills')) idx = 1;
    else if (r.status === 'running') idx = 0;
  }
  if (idx === -1) return null;
  const el = document.createElement('div'); el.className = 'vsteps';
  ['voice','stills','clip','live'].forEach((n, i) => {
    const s = document.createElement('span');
    s.className = 's' + (idx === 4 || i < idx ? ' done' : i === idx ? ' now' : '');
    s.textContent = n;
    el.appendChild(s);
    if (i < 3) { const a = document.createElement('span'); a.className = 'ar'; a.textContent = '→'; el.appendChild(a); }
  });
  return el;
}

// one-line status for vault rows — the actual gate UIs live in the stage panes
function statusLine(j) {
  const r = j.render;
  const wrap = document.createElement('div');
  wrap.className = 'vrender';
  if (r.status === 'running') wrap.textContent = `⏳ ${r.step}…`;
  else if (r.status === 'awaiting_scene') wrap.textContent = 'waiting on you: pick a still';
  else if (r.status === 'awaiting_publish') wrap.textContent = 'waiting on you: review the take';
  else if (r.status === 'done') { wrap.classList.add('ok'); wrap.innerHTML = `✓ live — <a href="/clips" target="_blank" style="color:#3ddc84;">gallery ↗</a>`; }
  else if (r.status === 'rejected') wrap.textContent = 'binned';
  else if (r.status === 'cancelled') wrap.textContent = 'cancelled';
  else { wrap.classList.add('err'); wrap.textContent = `✗ render ${r.status}: ${r.error || ''}`; }
  return wrap;
}

function renderVault() {
  const list = vaultTab === 'produced'
    ? (vaultData.accepted || []).filter(j => j.produced)
    : (vaultData[vaultTab] || []);
  vaultList.innerHTML = '';
  if (!list.length) { vaultList.innerHTML = '<div class="vempty">nothing here yet</div>'; return; }
  const items = [...list].reverse();
  if (vaultTab === 'accepted') items.sort((a, b) =>
    ((b.render && RENDER_ACTIVE.has(b.render.status)) ? 1 : 0) - ((a.render && RENDER_ACTIVE.has(a.render.status)) ? 1 : 0));
  for (const j of items) {
    const row = document.createElement('div');
    const active = j.render && RENDER_ACTIVE.has(j.render.status);
    row.className = 'vrow' + (j.produced ? ' produced' : '') + (active ? ' hot' : '');
    if (j.produced) {
      const f = document.createElement('div'); f.className = 'vflag'; f.textContent = '✓ produced';
      row.appendChild(f);
    }
    const txt = document.createElement('div');
    txt.className = 'vtxt'; txt.textContent = j.text;
    row.appendChild(txt);
    const btns = document.createElement('div');
    btns.className = 'vbtns';
    const mk = (label, cls, fn) => { const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = fn; btns.appendChild(b); return b; };
    const hearBtn = mk('🔊', '', async () => {
      hearBtn.textContent = '…';
      const r = await fetch('/api/jokes/speak', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:j.id}) });
      const d = await r.json();
      hearBtn.textContent = '🔊';
      if (d.audioUrl) new Audio(d.audioUrl).play().catch(() => {});
    });
    const move = async to => { await fetch('/api/jokes/move', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:j.id, to}) }); loadVault(); loadCounts(); };
    const bar = vaultTab !== 'rejected' && stageBar(j);
    if (bar) row.appendChild(bar);
    if (j.render && j.render.status !== 'none') row.appendChild(statusLine(j));
    const locked = isLocked(j) && !unlocked.has(j.id);
    if (locked) {
      mk('▶ review', '', () => { jokesCache = vaultData; startProduction(j.id); });
      btns.appendChild(lockRow(j, renderVault));
    } else if (vaultTab === 'accepted' || vaultTab === 'produced') {
      mk(j.render && j.render.status !== 'none' ? '▶ resume work' : '🎬 clip', j.render && RENDER_ACTIVE.has(j.render.status) ? 'prod' : '',
        () => { jokesCache = vaultData; startProduction(j.id); });
      mk(j.produced ? 'unmark produced' : '✓ produced', 'prod', async () => {
        await fetch('/api/jokes/produce', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:j.id, produced:!j.produced}) });
        loadVault();
      });
      if (isLocked(j)) mk('🔓 lock', '', () => { unlocked.delete(j.id); renderVault(); });
      mk('→ toss', '', () => move('rejected'));
    } else {
      mk('→ keep', 'prod', () => move('accepted'));
    }
    if (!locked) mk('edit', '', () => startVaultEdit(row, j));
    if (!locked) mk('delete', 'del', async () => {
      if (!confirm('Delete this joke forever?')) return;
      await fetch('/api/jokes/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:j.id}) });
      loadVault(); loadCounts();
    });
    row.appendChild(btns);
    vaultList.appendChild(row);
  }
}

// --- stage-organized production: voice → image → video, sequential ---
let stage = 'voice';
let jokesCache = null;
let currentId = localStorage.getItem('prodJoke') || null;

const controlsEl = document.getElementById('controls');
const voiceSec = document.getElementById('stage-voice');
const imageSec = document.getElementById('stage-image');
const videoSec = document.getElementById('stage-video');
const imagePane = document.getElementById('imagePane');
const videoPane = document.getElementById('videoPane');

function currentJoke() {
  if (!currentId || !jokesCache) return null;
  return [...(jokesCache.accepted || []), ...(jokesCache.pending || []), ...(jokesCache.rejected || [])]
    .find(j => j.id === currentId) || null;
}
const sigOf = j => j?.render ? `${j.render.status}:${j.render.step || ''}:${(j.render.scenes || []).length}` : '';
const atVideoStep = r => r && (r.status === 'awaiting_publish' || r.status === 'done'
  || (r.status === 'running' && ['render', 'publish'].includes(r.step))
  || (['error', 'interrupted'].includes(r.status) && r.step === 'render'));

async function refreshJokes() {
  try { jokesCache = await (await fetch('/api/jokes')).json(); } catch { return; }
  setKept(jokesCache.accepted.length);
  updateNav();
}

function videoAllowed() { const j = currentJoke(); return !!(j && atVideoStep(j.render)); }

function updateNav() {
  const j = currentJoke();
  document.querySelector('.stab[data-s="video"]').disabled = !videoAllowed();
  let imgDot = false, vidDot = false;
  for (const x of (jokesCache?.accepted || [])) {
    if (x.render?.status === 'awaiting_scene') imgDot = true;
    if (x.render?.status === 'awaiting_publish') vidDot = true;
  }
  for (const [s, on] of [['image', imgDot], ['video', vidDot]]) {
    const tab = document.querySelector(`.stab[data-s="${s}"]`);
    tab.querySelector('.dot')?.remove();
    if (on) { const d = document.createElement('span'); d.className = 'dot'; tab.appendChild(d); }
  }
  document.getElementById('workOn').textContent = j ? `working on: “${j.text.slice(0, 45)}…”` : '';
}

function setStage(s) {
  if (s === 'video' && !videoAllowed()) return; // sequential — earn it at the stills gate
  stage = s;
  document.querySelectorAll('#stageBar .stab').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  voiceSec.hidden = s !== 'voice';
  imageSec.hidden = s !== 'image';
  videoSec.hidden = s !== 'video';
  controlsEl.style.display = s === 'voice' ? '' : 'none';
  renderStage();
}
document.querySelectorAll('#stageBar .stab').forEach(b => { b.onclick = () => setStage(b.dataset.s); });

function renderStage() {
  if (stage === 'image') renderImage();
  else if (stage === 'video') renderVideo();
  updateNav();
}

function startProduction(id) {
  currentId = id;
  localStorage.setItem('prodJoke', id);
  const r = currentJoke()?.render;
  vaultEl.classList.remove('open');
  setStage(r && atVideoStep(r) ? 'video' : 'image');
  ensurePolling();
}

function hintEl(text, cls) { const d = document.createElement('div'); d.className = 'phint' + (cls ? ' ' + cls : ''); d.textContent = text; return d; }
function jokeCard(j, tag) {
  const d = document.createElement('div'); d.className = 'pjoke';
  const t = document.createElement('div'); t.className = 'ptag'; t.textContent = tag || 'in production';
  d.appendChild(t);
  d.appendChild(document.createTextNode(j.text));
  const bar = stageBar(j); if (bar) d.appendChild(bar);
  return d;
}

// IMAGE stage: pick joke → direction → prompt → 4 stills → pick one
function renderImage() {
  const j = currentJoke();
  const r = j?.render;
  imagePane.innerHTML = '';
  if (!j) {
    imagePane.appendChild(hintEl('pick a kept joke — the image step builds the scene Jacob stands in', 'big'));
    const pl = document.createElement('div'); pl.className = 'picklist';
    for (const x of (jokesCache?.accepted || [])) {
      const row = document.createElement('div'); row.className = 'pickrow';
      const badge = x.render ? (RENDER_ACTIVE.has(x.render.status) ? '⏳ ' + x.render.step
        : x.render.status === 'done' ? '✓ live' : x.render.status) : '🎬';
      row.innerHTML = `<span></span><b>${badge}</b>`;
      row.querySelector('span').textContent = x.text;
      row.onclick = () => { currentId = x.id; localStorage.setItem('prodJoke', x.id); renderStage(); };
      pl.appendChild(row);
    }
    if (!(jokesCache?.accepted || []).length) pl.appendChild(hintEl('nothing kept yet — go keep jokes in the voice step'));
    imagePane.appendChild(pl);
    return;
  }
  imagePane.appendChild(jokeCard(j));
  if (!r || ['none', 'rejected', 'cancelled'].includes(r.status)
      || (['error', 'interrupted'].includes(r.status) && r.step !== 'render')) {
    if (r && ['error', 'interrupted'].includes(r.status)) imagePane.appendChild(hintEl(`last run ${r.status}: ${r.error || ''} — adjust and go again`));
    if (r && r.status === 'rejected') imagePane.appendChild(hintEl('last take was binned — new direction, new stills'));
    renderDirection(imagePane, j);
    return;
  }
  if (r.status === 'awaiting_scene') { renderStillGate(imagePane, j); return; }
  if (r.status === 'running' && r.step !== 'render') { imagePane.appendChild(hintEl(`⏳ ${r.step}…`)); return; }
  if (r.sceneUrl) { const im = document.createElement('img'); im.className = 'sceneBig'; im.src = r.sceneUrl; imagePane.appendChild(im); }
  imagePane.appendChild(hintEl('still locked ✓ — this joke is at the video step'));
}

function renderDirection(pane, j) {
  const wrap = document.createElement('div'); wrap.className = 'rform';
  const lset = document.createElement('div'); lset.className = 'flabel'; lset.textContent = 'setting hint';
  const setting = document.createElement('input'); setting.placeholder = 'blank = AI picks a setting that suits the joke';
  const lor = document.createElement('div'); lor.className = 'flabel'; lor.textContent = 'orientation';
  const or = document.createElement('select');
  or.innerHTML = '<option value="vertical">vertical (phone)</option><option value="horizontal">horizontal</option>';
  const rr = document.createElement('div'); rr.className = 'rrow';
  const next = document.createElement('button'); next.className = 'prod'; next.textContent = '✨ write the prompt';
  const st = document.createElement('span'); st.className = 'rstatus';
  rr.append(next, st);
  wrap.append(lset, setting, lor, or, rr);
  pane.appendChild(wrap);
  next.onclick = async () => {
    next.disabled = true; st.textContent = 'AI is drafting the scene…';
    const d = await (await fetch('/api/jokes/render-preview', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: j.id, setting: setting.value, orientation: or.value }) })).json();
    wrap.innerHTML = '';
    const lp = document.createElement('div'); lp.className = 'flabel'; lp.textContent = 'scene prompt — edit freely';
    const ta = document.createElement('textarea'); ta.rows = 6; ta.value = d.prompt;
    const lm = document.createElement('div'); lm.className = 'flabel'; lm.textContent = 'movement direction';
    const mo = document.createElement('input'); mo.value = d.defaultMotion || '';
    const rr2 = document.createElement('div'); rr2.className = 'rrow';
    const gen = document.createElement('button'); gen.className = 'prod'; gen.textContent = 'generate 4 stills (~$0.25)';
    const back = document.createElement('button'); back.textContent = '← direction';
    const st2 = document.createElement('span'); st2.className = 'rstatus';
    rr2.append(gen, back, st2);
    wrap.append(lp, ta, lm, mo, rr2);
    ta.focus();
    back.onclick = () => renderImage();
    gen.onclick = async () => {
      gen.disabled = true; st2.textContent = 'starting…';
      const x = await fetch('/api/jokes/render', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: j.id, prompt: ta.value, motion: mo.value, orientation: or.value }) });
      const dd = await x.json();
      if (!x.ok) { st2.textContent = dd.error || 'failed'; gen.disabled = false; return; }
      await refreshJokes(); renderStage(); ensurePolling();
    };
  };
}

function renderStillGate(pane, j) {
  const r = j.render;
  const wrap = document.createElement('div'); wrap.className = 'rform';
  const grid = document.createElement('div'); grid.className = 'vscenes';
  let picked = r.pick ?? -1;
  (r.scenes || []).forEach((u, i) => {
    const img = document.createElement('img');
    img.src = u; img.loading = 'lazy'; img.alt = `still ${i + 1}`;
    if (i === picked) img.classList.add('pick');
    img.onclick = () => { picked = i; grid.querySelectorAll('img').forEach(x => x.classList.remove('pick')); img.classList.add('pick'); };
    grid.appendChild(img);
  });
  const lp = document.createElement('div'); lp.className = 'flabel'; lp.textContent = 'scene prompt — edit and reroll';
  const ta = document.createElement('textarea'); ta.rows = 5; ta.value = r.prompt || '';
  const lm = document.createElement('div'); lm.className = 'flabel'; lm.textContent = 'movement direction';
  const mo = document.createElement('input'); mo.value = r.motion || ''; mo.placeholder = 'movement direction';
  const rr = document.createElement('div'); rr.className = 'rrow';
  const again = document.createElement('button'); again.textContent = '↻ 4 new (~$0.25)';
  const go = document.createElement('button'); go.className = 'prod'; go.textContent = 'render picked (~$0.75)';
  const cancel = document.createElement('button'); cancel.textContent = '✕ start over';
  cancel.title = 'scrap these stills, back to direction';
  const st = document.createElement('span'); st.className = 'rstatus'; st.textContent = 'tap a still — or edit the prompt and reroll';
  rr.append(again, go, cancel, st);
  wrap.append(grid, lp, ta, lm, mo, rr);
  pane.appendChild(wrap);
  const post = body => fetch('/api/jokes/render-action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jokeId: j.id, ...body }) });
  again.onclick = async () => {
    again.disabled = true; st.textContent = 'generating…';
    const d = await (await post({ action: 'new-stills', prompt: ta.value, motion: mo.value })).json();
    if (d.error) { st.textContent = d.error; again.disabled = false; } else { await refreshJokes(); ensurePolling(); }
  };
  go.onclick = async () => {
    if (picked < 0) { st.textContent = 'pick a still first'; return; }
    st.textContent = 'rendering…';
    const d = await (await post({ action: 'approve-scene', pick, motion: mo.value })).json();
    if (d.error) { st.textContent = d.error; return; }
    await refreshJokes(); setStage('video'); ensurePolling();
  };
  cancel.onclick = async () => {
    if (!confirm('start over? the stills and voice stay on disk but this job resets')) return;
    await post({ action: 'cancel' }); await refreshJokes(); renderStage();
  };
}

// published clips are locked against accidents until explicitly unlocked
const unlocked = new Set();
const isLocked = j => j.produced || j.render?.status === 'done';
function lockRow(j, reveal) {
  const b = document.createElement('button');
  b.textContent = '🔒 published — unlock?';
  b.title = 'protects a finished clip from accidents';
  b.onclick = () => {
    if (confirm('unlock this published clip? you\'ll be able to unpublish / move / delete it')) {
      unlocked.add(j.id); reveal();
    }
  };
  return b;
}

// VIDEO stage: watch → publish or bin
function renderVideo() {
  const j = currentJoke();
  const r = j?.render;
  videoPane.innerHTML = '';
  if (!r || !atVideoStep(r)) {
    videoPane.appendChild(hintEl('nothing at the video step yet', 'big'));
  } else {
    videoPane.appendChild(jokeCard(j));
    if (r.status === 'running') videoPane.appendChild(hintEl(`⏳ ${r.step}… a few minutes`));
    if (['error', 'interrupted'].includes(r.status) && r.step === 'render') {
      videoPane.appendChild(hintEl(`✗ render ${r.status}: ${r.error || ''}`));
      const re = document.createElement('button'); re.className = 'prod'; re.textContent = '↻ retry render (~$0.75)';
      re.style.alignSelf = 'flex-start';
      re.onclick = async () => {
        re.disabled = true;
        await fetch('/api/jokes/render-action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jokeId: j.id, action: 'retry' }) });
        await refreshJokes(); renderStage(); ensurePolling();
      };
      const bk = document.createElement('button'); bk.textContent = '← back to stills';
      bk.style.alignSelf = 'flex-start';
      bk.onclick = async () => {
        bk.disabled = true;
        await fetch('/api/jokes/render-action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jokeId: j.id, action: 'back' }) });
        await refreshJokes(); setStage('image');
      };
      videoPane.append(re, bk);
    }
    if (r.status === 'awaiting_publish') {
      const a = document.createElement('a'); a.className = 'watch'; a.href = r.clipPreview; a.target = '_blank'; a.textContent = '▶ watch the take';
      const br = document.createElement('div'); br.className = 'rrow';
      const pub = document.createElement('button'); pub.className = 'prod'; pub.textContent = 'publish to gallery';
      const back = document.createElement('button'); back.textContent = '← back to stills';
      back.title = 'scrap this take, keep the stills';
      const bin = document.createElement('button'); bin.className = 'del'; bin.textContent = 'bin it';
      br.append(pub, back, bin);
      videoPane.append(a, br);
      back.onclick = async () => {
        back.disabled = true;
        await fetch('/api/jokes/render-action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jokeId: j.id, action: 'back' }) });
        await refreshJokes(); setStage('image');
      };
      pub.onclick = async () => {
        pub.disabled = true;
        await fetch('/api/jokes/render-action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jokeId: j.id, action: 'publish' }) });
        await refreshJokes(); renderStage(); ensurePolling();
      };
      bin.onclick = async () => {
        if (!confirm('bin this take? it stays off the gallery')) return;
        await fetch('/api/jokes/render-action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jokeId: j.id, action: 'reject' }) });
        await refreshJokes(); setStage('image');
      };
    }
    if (r.status === 'done') {
      videoPane.appendChild(hintEl('✓ live in the gallery — locked'));
      const a = document.createElement('a'); a.className = 'watch'; a.href = '/clips'; a.target = '_blank'; a.textContent = 'see it on the wall ↗';
      const nx = document.createElement('button'); nx.textContent = 'next joke →';
      nx.style.alignSelf = 'flex-start';
      nx.onclick = () => { currentId = null; localStorage.removeItem('prodJoke'); setStage('image'); };
      videoPane.append(a, nx);
      if (unlocked.has(j.id)) {
        const ur = document.createElement('div'); ur.className = 'rrow';
        const un = document.createElement('button'); un.className = 'del'; un.textContent = 'unpublish (pull off the wall)';
        const rl = document.createElement('button'); rl.textContent = '🔓 lock again';
        ur.append(un, rl);
        videoPane.appendChild(ur);
        un.onclick = async () => {
          if (!confirm('pull this clip off the gallery? it goes back to review')) return;
          un.disabled = true;
          await fetch('/api/jokes/render-action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ jokeId: j.id, action: 'unpublish' }) });
          await refreshJokes(); renderStage(); ensurePolling();
        };
        rl.onclick = () => { unlocked.delete(j.id); renderStage(); };
      } else {
        videoPane.appendChild(lockRow(j, renderStage));
      }
    }
  }
  // other takes parked at this step
  const others = (jokesCache?.accepted || []).filter(x => x.id !== currentId && atVideoStep(x.render));
  if (others.length) {
    videoPane.appendChild(hintEl('also at the video step:'));
    const pl = document.createElement('div'); pl.className = 'picklist';
    for (const x of others) {
      const row = document.createElement('div'); row.className = 'pickrow';
      row.innerHTML = `<span></span><b>${x.render.status === 'awaiting_publish' ? 'review' : '⏳'}</b>`;
      row.querySelector('span').textContent = x.text;
      row.onclick = () => startProduction(x.id);
      pl.appendChild(row);
    }
    videoPane.appendChild(pl);
  }
}

let pollTimer = null;
function ensurePolling() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    const busy = currentId || (jokesCache?.accepted || []).some(x => x.render && RENDER_ACTIVE.has(x.render.status));
    if (!busy) { clearInterval(pollTimer); pollTimer = null; return; }
    const prevSig = sigOf(currentJoke());
    await refreshJokes();
    const j = currentJoke();
    if (sigOf(j) === prevSig) return;
    if (j?.render?.status === 'awaiting_scene') setStage('image');       // gate needs you
    else if (j?.render?.status === 'awaiting_publish') setStage('video'); // gate needs you
    else renderStage();
  }, 5000);
}

function startVaultEdit(row, j) {
  const txt = row.querySelector('.vtxt');
  const ta = document.createElement('textarea');
  ta.value = j.text; ta.rows = 4;
  txt.replaceWith(ta);
  ta.focus();
  const btns = row.querySelector('.vbtns');
  btns.innerHTML = '';
  const save = document.createElement('button'); save.textContent = 'save'; save.className = 'prod';
  const cancel = document.createElement('button'); cancel.textContent = 'cancel';
  btns.append(save, cancel);
  cancel.onclick = () => renderVault();
  save.onclick = async () => {
    const text = ta.value.trim(); if (!text) return;
    await fetch('/api/jokes/edit', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id:j.id, text}) });
    j.text = text;
    renderVault();
  };
}

document.getElementById('vaultAdd').onclick = () => {
  const f = document.getElementById('addForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
  document.getElementById('addMsg').textContent = '';
  if (f.style.display === 'block') document.getElementById('addText').focus();
};
document.getElementById('addCancel').onclick = () => {
  document.getElementById('addForm').style.display = 'none';
  document.getElementById('addText').value = '';
};
document.getElementById('addSave').onclick = async () => {
  const text = document.getElementById('addText').value.trim();
  if (!text) return;
  const r = await fetch('/api/jokes/add', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ text, to: vaultTab || 'accepted' }) });
  const d = await r.json();
  if (!r.ok) { document.getElementById('addMsg').textContent = d.error; return; }
  document.getElementById('addText').value = '';
  document.getElementById('addForm').style.display = 'none';
  loadVault(); loadCounts();
};

document.getElementById('vaultBtn').onclick = () => { vaultEl.classList.add('open'); loadVault(); };
document.getElementById('vaultClose').onclick = () => vaultEl.classList.remove('open');
vaultEl.onclick = e => { if (e.target === vaultEl) vaultEl.classList.remove('open'); };
document.querySelectorAll('#vaultHead .tab').forEach(t => {
  t.onclick = () => {
    if (!t.dataset.t) return;
    document.querySelectorAll('#vaultHead .tab').forEach(x => x.classList.toggle('on', x === t));
    vaultTab = t.dataset.t;
    renderVault();
  };
});

document.getElementById('logout').onclick = async () => {
  await fetch('/api/logout', { method: 'POST' });
  location.href = '/';
};

loadTranscript();
refreshJokes().then(() => {
  const j = currentJoke();
  if (j && j.render && RENDER_ACTIVE.has(j.render.status)) startProduction(j.id); // pick up where we left off
});
loadBalance();
</script>
</body>
</html>
